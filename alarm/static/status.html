<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Status alarmen</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f6f4; --surface: #fff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --border: rgba(11, 11, 11, .12);
      --ok: #0a7d0a; --ok-bg: #e3f4e3; --alarm: #c42b2b; --alarm-bg: #fbe4e4;
      --warn: #9a5b00; --warn-bg: #fdf0d9; --paused: #5f5e5a; --paused-bg: #ebeae6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --border: rgba(255, 255, 255, .12);
        --ok: #3fbf3f; --ok-bg: #16301a; --alarm: #ff6b6b; --alarm-bg: #3a1717;
        --warn: #f0b04a; --warn-bg: #362812; --paused: #b3b2ab; --paused-bg: #2b2b29;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .banner { border-radius: 12px; padding: 16px 18px; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .banner small { display: block; font-size: 14px; font-weight: 400; margin-top: 2px; }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.alarm { background: var(--alarm-bg); color: var(--alarm); }
    .stale { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
    .rule { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .rule.alarm { border-left-color: var(--alarm); }
    .rule.ok { border-left-color: var(--ok); }
    .rule.pending, .rule.error { border-left-color: var(--warn); }
    .rule.paused, .rule.empty { border-left-color: var(--paused); opacity: .8; }
    .top { display: flex; align-items: center; gap: 8px; }
    .top b { flex: 1; font-size: 16px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .st-ok { color: var(--ok); background: var(--ok-bg); }
    .st-alarm { color: var(--alarm); background: var(--alarm-bg); }
    .st-pending, .st-error { color: var(--warn); background: var(--warn-bg); }
    .st-paused, .st-empty { color: var(--paused); background: var(--paused-bg); }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li { padding: 8px 0; border-top: 1px solid var(--border); }
    li b { display: block; }
    .reason { color: var(--ink-2); }
    .since { font-size: 13px; color: var(--muted); }
    .chip { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px; margin-left: 4px; background: var(--ok-bg); color: var(--ok); }
    .chip.grey { background: var(--paused-bg); color: var(--paused); }
    .resolved { color: var(--ok); }
    .sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
    details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 6px; }
    footer { margin: 24px 0 8px; text-align: center; }
    footer a { color: var(--muted); }
    .error-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; text-align: center; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Status alarmen</h1>
    <span class="muted" id="updated">laden…</span>
  </header>
  <div id="content"></div>
  <footer><span class="muted">Alleen-lezen · ververst elke 30 seconden · </span><a href="./">aanmelden voor beheer</a></footer>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null && v !== false) k === "class" ? (e.className = v) : e.setAttribute(k, v);
  for (const c of children.flat(Infinity)) if (c != null && c !== false) e.append(c);
  return e;
}
const clock = new Intl.DateTimeFormat("nl-BE", { hour: "2-digit", minute: "2-digit" });
const dayClock = new Intl.DateTimeFormat("nl-BE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function when(s, now) {
  const d = new Date(s * 1000);
  return (now - s < 86400 && new Date(now * 1000).getDate() === d.getDate() ? clock : dayClock).format(d);
}
function dur(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 3600) return `${Math.max(1, Math.round(sec / 60))} min`;
  if (sec < 172800) { const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return m ? `${h} u ${m} min` : `${h} u`; }
  return `${Math.round(sec / 86400)} dagen`;
}
const LABEL = { alarm: "ALARM", ok: "OK", pending: "Let op", error: "Fout", paused: "Gepauzeerd", empty: "Geen waarden" };

function rule(r, now) {
  const card = el("section", { class: `rule ${r.state}` },
    el("div", { class: "top" }, el("b", {}, r.name), el("span", { class: `badge st-${r.state}` }, LABEL[r.state] || r.state)));
  if (r.alarms.length) {
    card.append(el("ul", {}, r.alarms.map((a) => el("li", {},
      el("b", {}, a.label, a.acked ? el("span", { class: "chip" }, "bevestigd") : null),
      el("span", { class: "reason" }, a.reason),
      el("div", { class: "since" }, `sinds ${when(a.started, now)} (${dur(now - a.started)})`)))));
  } else if (r.state === "ok") {
    card.append(el("div", { class: "sub" }, `${r.checks} waarde${r.checks === 1 ? "" : "n"} in orde`));
  } else if (r.state === "pending") {
    card.append(el("div", { class: "sub" }, "Een waarde ligt buiten de grens, maar nog niet lang genoeg voor een alarm."));
  } else if (r.state === "error") {
    card.append(el("div", { class: "sub" }, "De waarden konden niet gecontroleerd worden."));
  }
  if (r.ignored.length) {
    card.append(el("div", { class: "sub" }, `${r.ignored.length} oud alarm genegeerd (te lang niet opgelost): `,
      r.ignored.map((a) => a.label).join(", ")));
  }
  if (r.resolved.length) {
    card.append(el("details", {}, el("summary", {}, `${r.resolved.length} opgelost in de laatste 24 u`),
      el("ul", {}, r.resolved.map((a) => el("li", {},
        el("b", { class: "resolved" }, "✓ ", a.label),
        el("span", { class: "reason" }, a.reason),
        el("div", { class: "since" }, `${when(a.started, now)} – ${when(a.resolved, now)} (${dur(a.resolved - a.started)})`))))));
  }
  return card;
}

async function load() {
  let data;
  try {
    const res = await fetch("api/public/status", { cache: "no-store" });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
  } catch (e) {
    $("content").replaceChildren(el("div", { class: "error-box" }, "Status niet beschikbaar: ", e.message));
    $("updated").textContent = "";
    return;
  }
  const now = data.now;
  const rules = data.orgs.flatMap((o) => o.rules);
  const inAlarm = rules.filter((r) => r.state === "alarm");
  const values = inAlarm.reduce((n, r) => n + r.alarms.length, 0);
  const parts = [];
  parts.push(inAlarm.length
    ? el("div", { class: "banner alarm" }, `${values} waarde${values === 1 ? "" : "n"} in alarm`,
      el("small", {}, `in ${inAlarm.length} regel${inAlarm.length === 1 ? "" : "s"}`))
    : el("div", { class: "banner ok" }, "Alles in orde", el("small", {}, `${rules.length} regel${rules.length === 1 ? "" : "s"} bewaakt`)));
  // The checker itself may have stopped: say so instead of showing an old "OK".
  const staleAfter = Math.max(300, 3 * data.interval);
  if (!data.last_run || now - data.last_run > staleAfter) {
    parts.push(el("div", { class: "stale" }, data.last_run
      ? `⚠ De controle draait niet meer sinds ${when(data.last_run, now)}: deze status kan verouderd zijn.`
      : "⚠ De controle is nog niet gestart."));
  }
  const many = data.orgs.length > 1;
  for (const o of data.orgs) {
    if (!o.rules.length) continue;
    if (many) parts.push(el("h2", {}, o.name));
    parts.push(...o.rules.map((r) => rule(r, now)));
  }
  if (!rules.length) parts.push(el("div", { class: "error-box" }, "Er zijn nog geen regels."));
  $("content").replaceChildren(...parts);
  $("updated").textContent = `bijgewerkt ${clock.format(new Date(now * 1000))}` +
    (data.last_run ? ` · laatste controle ${clock.format(new Date(data.last_run * 1000))}` : "");
  document.title = inAlarm.length ? `(${values}) Status alarmen` : "Status alarmen";
}

load();
setInterval(() => !document.hidden && load(), 30000);
document.addEventListener("visibilitychange", () => !document.hidden && load());
</script>
</body>
</html>
