[general]
static = yes
writeprotect = yes

; Incoming calls are not used.
[from-trunk]
exten => _.,1,Hangup()

; The answered side of an alarm call. Variables set by the app on Originate:
;   ALARM_CALL_ID   id to match the result
;   ALARM_SOUND     message (sound file without extension, e.g. alarm/call-12)
;   ALARM_ACK_SOUND confirmation after pressing 1
; The result is reported to the app with a UserEvent "AlarmCall".
[alarm-call]
exten => s,1,NoOp(Alarm call ${ALARM_CALL_ID})
 same => n,Set(ACKED=0)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TRIES=0)
 same => n(play),Read(KEY,${ALARM_SOUND},1,,1,6)
 same => n,GotoIf($["${KEY}" = "1"]?ack)
 same => n,Set(TRIES=$[${TRIES} + 1])
 same => n,GotoIf($[${TRIES} < 3]?play)
 same => n,Hangup()
 same => n(ack),Set(ACKED=1)
 same => n,UserEvent(AlarmCall,AlarmCallId: ${ALARM_CALL_ID},Result: ack)
 same => n,Playback(${ALARM_ACK_SOUND})
 same => n,Hangup()
; No "1" pressed (hung up, voicemail, or listened 3 times without reacting).
exten => h,1,GotoIf($["${ACKED}" = "1"]?done)
 same => n,UserEvent(AlarmCall,AlarmCallId: ${ALARM_CALL_ID},Result: noack)
 same => n(done),NoOp()

; Simulated phones for testing without a SIP provider (numbers "test:1001" etc. in the app).
[alarm-test]
; answers and presses 1
exten => 1001,1,Answer()
 same => n,Wait(3)
 same => n,SendDTMF(1)
 same => n,Wait(15)
 same => n,Hangup()
; answers but never presses 1 (like a voicemail)
exten => 1002,1,Answer()
 same => n,Wait(40)
 same => n,Hangup()
; never answers
exten => 1003,1,Ringing()
 same => n,Wait(300)
