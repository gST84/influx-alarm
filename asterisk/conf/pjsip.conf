[global]
type = global
user_agent = influx-alarm

[transport-main]
type = transport
protocol = ${SIP_TRANSPORT}
bind = 0.0.0.0:5060
${NAT_LINES}

;; TRUNK START
[trunk-reg]
type = registration
outbound_auth = trunk-auth
server_uri = sip:${SIP_HOST}:${SIP_PORT}
client_uri = sip:${SIP_USERNAME}@${SIP_HOST}
retry_interval = 60
forbidden_retry_interval = 600
expiration = 300

[trunk-auth]
type = auth
auth_type = userpass
username = ${SIP_AUTH_USERNAME}
password = ${SIP_PASSWORD}

[trunk]
type = aor
contact = sip:${SIP_HOST}:${SIP_PORT}
qualify_frequency = 60

[trunk]
type = endpoint
context = from-trunk
disallow = all
allow = alaw,ulaw,g722
outbound_auth = trunk-auth
aors = trunk
from_user = ${SIP_USERNAME}
from_domain = ${SIP_FROM_DOMAIN}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
send_pai = yes

[trunk-identify]
type = identify
endpoint = trunk
match = ${SIP_HOST}
;; TRUNK END
